---
- name: Récupérer le GID du groupe docker
  ansible.builtin.getent:
    database: group
    key: docker

- name: Créer le dossier de Jenkins
  ansible.builtin.file:
    path: "{{ jenkins_dir }}"
    state: directory
    mode: "0755"

- name: Copier le Dockerfile et la liste des plugins
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ jenkins_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - Dockerfile
    - plugins.txt

- name: Générer le docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_dir }}/docker-compose.yml"
    mode: "0644"

- name: Démarrer Jenkins
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_dir }}"
    state: present

- name: Attendre que Jenkins réponde
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_http_port }}/login"
    status_code: [200, 403]
  register: jenkins_up
  until: jenkins_up.status in [200, 403]
  retries: 30
  delay: 10
